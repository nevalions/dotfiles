approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[tui]
notifications = false
status_line = ["current-dir", "model-with-reasoning", "context-used", "used-tokens", "git-branch", "five-hour-limit", "weekly-limit"]

[features]
daemon_auto_start = false

[agents]
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[agents.git-workflow]
description = "Execute explicitly requested commit, push/PR preparation and merge workflows with Luna low."
config_file = "agents/git-workflow.toml"

[agents.watch_ci]
description = "Read-only CI watcher for exact commits and runs, using Luna low."
config_file = "agents/watch_ci.toml"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.perplexity]
command = "codex-mcp-env"
args = ["perplexity", "npx", "-y", "@perplexity-ai/mcp-server"]
env_vars = ["PERPLEXITY_API_KEY"]
startup_timeout_sec = 60

[mcp_servers.forgejo]
default_tools_approval_mode = "writes"
command = "codex-mcp-env"
args = ["forgejo", "npx", "-y", "@ric_/forgejo-mcp"]
env_vars = ["FORGEJO_URL", "FORGEJO_TOKEN"]
startup_timeout_sec = 60

[mcp_servers.atuin]
command = "atuin"
args = ["mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60

[mcp_servers.honcho]
command = "codex-honcho-mcp"
args = ["--auto-grant"]
env_vars = ["XDG_RUNTIME_DIR", "HONCHO_CONFIG_PATH", "HONCHO_BASE_URL", "HONCHO_URL", "HONCHO_ENDPOINT", "HONCHO_API_KEY", "HONCHO_WORKSPACE", "HONCHO_WORKSPACE_ID"]
startup_timeout_sec = 60
default_tools_approval_mode = "writes"
