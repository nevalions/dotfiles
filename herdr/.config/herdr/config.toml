# herdr configuration — ~/.config/herdr/config.toml
# Terminal workspace manager for AI coding agents.
# Reference dump of every option: `herdr --default-config`
# Validate after edits:                `herdr config check`
# Apply without restarting the server: `herdr server reload-config` (or prefix+alt+r)

# Config here is deliberate, so skip the first-run notification wizard.
onboarding = false

[theme]
# Built-in: catppuccin, terminal, tokyo-night, dracula, nord, gruvbox,
#           one-dark, solarized, kanagawa, rose-pine, vesper
# Matches tmux (omerxx/catppuccin-tmux), nvim and kitty.
name = "catppuccin"

# Follow the host terminal's light/dark appearance.
# auto_switch = false
# dark_name  = "catppuccin"
# light_name = "catppuccin-latte"

# Override individual palette tokens on top of the base theme.
[theme.custom]
# Unfocused pane borders. In normal typing mode the border colour is the ONLY
# focus cue: src/ui/panes.rs draws the focused pane's border and title in
# `accent` + bold and every other pane in `overlay0`. The DIM wash over
# unfocused panes is gated on `!terminal_active`, so it disappears exactly when
# you are typing. Dropping overlay0 from catppuccin's mid grey to surface1 makes
# the other panes recede instead of competing — needed now that a file-viewer
# split or reviewr sidebar puts several borders on screen at once.
overlay0 = "#45475a"

[terminal]
# Empty = $SHELL (zsh here), then /bin/sh.
default_shell = ""

# "auto" | "login" | "non_login" — "auto" only forces login shells on macOS.
shell_mode = "auto"

# CWD for new panes/tabs/workspaces: "follow" | "home" | "current" | fixed path.
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Same prefix as tmux (tmux/.config/tmux/tmux.conf sets `set -g prefix ^A`).
# Note: herdr has no send-prefix binding, so ctrl+a no longer reaches the shell
# as readline beginning-of-line inside a herdr pane — use Home instead.
# Don't nest herdr and tmux with this prefix; the outer one eats every ctrl+a.
prefix = "ctrl+a"

# --- session ---------------------------------------------------------------
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
# Rarely needed by key (the CLI `herdr server reload-config` covers it), so it
# yields prefix+shift+r to resize_mode, which in turn frees prefix+r for reviewr.
reload_config = "prefix+alt+r"

# --- workspaces (spaces) ---------------------------------------------------
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
# prefix+shift+h/j/k/l are herdr's built-in swap_pane_* — keep them, and put
# workspace cycling on direct ctrl+alt chords (the one modifier family no
# terminal or desktop environment claims, per herdr's keyboard docs).
previous_workspace = "ctrl+alt+p"
next_workspace = "ctrl+alt+n"
switch_workspace = "prefix+shift+1..9"

# --- git worktrees ---------------------------------------------------------
new_worktree = "prefix+shift+g"

# --- tabs ------------------------------------------------------------------
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# --- panes (vim motions, same muscle memory as tmux + vim-tmux-navigator) ---
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
rename_pane = "prefix+shift+p"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
edit_scrollback = "prefix+e"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
# Copy mode: hjkl / w b e / { } / ctrl+u ctrl+d to move, / and ? to search,
# v or Space to select, y or Enter to copy, q or Esc to leave.
copy_mode = "prefix+["
# Moved off the built-in prefix+shift+hjkl: herdr-plugin-workspace-manager's
# manifest binds prefix+shift+l to its "apply layout" action.
swap_pane_left = "ctrl+alt+h"
swap_pane_down = "ctrl+alt+j"
swap_pane_up = "ctrl+alt+k"
swap_pane_right = "ctrl+alt+l"

# --- agents ----------------------------------------------------------------
previous_agent = "prefix+comma"
next_agent = "prefix+period"
focus_agent = "prefix+alt+1..9"
open_notification_target = "prefix+o"
toggle_sidebar = "prefix+b"

# Navigate-mode movement (active only while the navigate overlay is open).
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Custom commands. type = "shell" (detached) | "pane" (temp pane) | "popup" (modal).
# `description` is what the `?` overlay shows for a custom command. Without it
# every entry renders as the literal string "custom command", so each one below
# sets it. Undocumented in `herdr --default-config`, but parsed (and tested) —
# see src/config/keybinds.rs.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "k9s"
description = "k9s popup"
width = "90%"
height = "90%"

# --- plugin actions ---------------------------------------------------------
# Plugin actions bind here, in the user config, not in the plugin manifest.
# command = "<plugin_id>.<action_id>" — the ids, not the titles.
# List them with `herdr plugin action list`.
# Note: herdr-plugin-workspace-manager already claims prefix+shift+l (apply).

# reviewr: diff sidebar beside the agent chat (persiyanov.reviewr).
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: diff sidebar (toggle)"

# file viewer, split beside the current pane (herdr-file-viewer).
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file viewer (split)"

# Same viewer in its own tab; switches to it if already open.
[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "file viewer (own tab)"

# herdr-plus: fuzzy-pick a project template and spin up its whole workspace.
# Templates are stowed in plugins/config/cloudmanic.herdr-plus/projects/ — the
# managed dir wins over ~/.config/herdr-plus when running under herdr.
[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "projects picker"

# herdr-plus: fuzzy launcher for one-off scripts, run in the launch directory.
[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "quick actions"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"

# Trial: peach instead of catppuccin blue (#89b4fa). The focused pane border is
# drawn in accent, and both the file viewer and reviewr render blue chrome of
# their own, so blue-on-blue was costing the focus cue. Peach is the warmest
# catppuccin accent and shares nothing with either plugin's palette.
accent = "#fab387" # catppuccin peach

mouse_capture = true
copy_on_select = true
mouse_scroll_lines = 3

confirm_close = true
prompt_new_tab_name = true
prompt_new_workspace_name = false

pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

# "spaces" groups by workspace; "priority" surfaces agents needing attention first.
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
# off | herdr (in-app toast) | terminal | system (OS notification service)
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
# Sound on agent state change in background workspaces.
enabled = true

[ui.sound.agents]
droid = "off"

[session]
# Restore agent panes into their native conversation sessions after a server restart.
resume_agents_on_restore = true

[remote]
# Keeps `herdr --remote` alive over the tailnet: herdr wraps ~/.ssh/config and
# adds ServerAliveInterval/ControlMaster fallbacks without overriding your values.
manage_ssh_config = true

[experimental]
# Nesting herdr inside a herdr pane stays off; use tabs/workspaces instead.
allow_nested = false
kitty_graphics = false
pane_history = false

[advanced]
scrollback_limit_bytes = 10000000
