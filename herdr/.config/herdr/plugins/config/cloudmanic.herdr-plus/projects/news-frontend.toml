# news-frontend — on-demand workspace for the main checkout.
# Ported from the news-frontend layout in workspace-manager's config.yml.
# See news-backend.toml for what the port loses (named agent panes, pane sizes);
# the server tab's shell pane was sized 12 rows there and splits evenly here.

name = "news-frontend"
description = "news-frontend, lo environment — agent, editor, dev server"
working_dir = "~/code/news-frontend"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "agent"
command = "claude"

[[tabs.panes]]
label = "editor"
command = "v"
split = "right"

[[tabs]]
name = "server"

[[tabs.panes]]
label = "dev"
command = "npm run dev:lo"

[[tabs.panes]]
label = "shell"
split = "down"

[[tabs]]
name = "git"
command = "lazygit"
