# stills-bank — on-demand workspace for the frame ingest/retrieval service.
#
# Same shape as statsboard.toml: three tabs (code, run, cli), each split into
# two vertical panes, back on the left and front on the right. The halves are
# not separate repos or subprojects here — the backend is the repo root and the
# front is app/ui — so only the front pane cd's, herdr-plus panes having no
# per-pane cwd, only working_dir.
#
# The front half is real but unusual: app/ui is Jinja templates plus htmx
# served by the same FastAPI app at /ui (dashboard, library, search, admin,
# persons), static under /ui/static. No build step, no node_modules, no dev
# server of its own — so where statsboard runs `ng s`, run/front runs the app
# itself under `uvicorn --reload`, which is what makes template and app.js
# edits show up on save. Verified: /ui/, /ui/library, /ui/search and /ui/admin
# all render from http://localhost:8010.
#
# Port 8010 rather than the container's 8000, because 8000 is news-lo's backend
# (news-backend/deploy/sites/lo/.env, NEWS_PORT) and uvicorn refuses to bind a
# taken port — the pane would die whenever that workspace was open. See
# ~/code/PORTS.md.
#
# run/back is scripts/up.sh: it checks .env, generates the nginx cert if
# missing, builds any missing image, runs `alembic upgrade head`, then
# `compose up -d` and exits back to a prompt — the stack keeps running in
# docker, so the pane is free for `docker compose logs -f stills-api
# stills-worker` when you want to watch it.
#
# The two halves are independent: back is the deployed shape (nginx on 80/443,
# stills-api internal-only, https://stills.lan/ui/ and /docs), front is the
# same code on 8010 without docker. Either runs without the other. Both read
# .env, whose DATABASE_URL points at the deployed database — this is a
# live-data UI, not a sandbox, so treat the admin pages as production. The
# compose postgres is profile "dev" and off by default; `docker compose
# --profile dev up` in the cli pane is the offline path.

name = "stills-bank"
description = "stills-bank — code, run, cli; service and its ui side by side"
working_dir = "~/code/stills-bank"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "back"

[[tabs.panes]]
label = "front"
command = "cd app/ui"
split = "right"

[[tabs]]
name = "run"

[[tabs.panes]]
label = "back"
command = "./scripts/up.sh"

[[tabs.panes]]
label = "front"
command = "uv run uvicorn app.api.main:create_app --factory --reload --port 8010"
split = "right"

[[tabs]]
name = "cli"

[[tabs.panes]]
label = "back"

[[tabs.panes]]
label = "front"
command = "cd app/ui"
split = "right"
