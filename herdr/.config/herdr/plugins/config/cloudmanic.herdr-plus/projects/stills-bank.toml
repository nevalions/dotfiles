# stills-bank — on-demand workspace for the frame ingest/retrieval service.
#
# Three tabs (code, run, cli) like the back/front projects, but the panes are
# not halves of a codebase: stills-bank is one Python service that runs as
# docker compose (stills-api, stills-worker, nginx), so the split is the app on
# the left and what it is doing on the right.
#
# run/app is scripts/up.sh, which checks .env, generates the nginx cert if
# missing, builds any image that is absent, runs `alembic upgrade head` and
# then `compose up -d` — so it exits back to a prompt rather than holding the
# server. That is why the right pane tails the logs: without it the run tab
# would go quiet the moment the stack was up.
#
# The compose postgres is profile "dev" and off by default — the real database
# is remote, per docker-compose.yml — so there is no local psql pane and no
# folded `docker start` like statsboard needs. `docker compose --profile dev up`
# in the cli pane is the offline path.
#
# cli/app is a plain shell for `uv run` commands (alembic, scripts/) and
# cli/compose is where one-off `docker compose exec|run` lines go.
#
# The UI is not a separate frontend: app/ui is Jinja templates plus htmx served
# by the same FastAPI app, mounted at /ui (dashboard, library, search, admin,
# persons), with its static files under /ui/static. So it has no build step, no
# node_modules and no dev server of its own — through the stack it is simply
# https://stills.lan/ui/, and the run tab already starts everything it needs.
#
# The ui tab exists for working *on* it. Templates and app.js are baked into
# the stills-api image, so with only the compose stack every edit costs a
# rebuild; `uvicorn --reload` against the same .env picks them up on save
# instead. Verified: /ui/, /ui/library, /ui/search and /ui/admin all render
# from http://localhost:8010. The port is 8010 rather than the container's 8000
# because 8000 is news-lo's backend (deploy/sites/lo/.env, NEWS_PORT=8000) and
# uvicorn would refuse to bind with that workspace open — see ~/code/PORTS.md.
# It reads .env like the container does, and that
# DATABASE_URL points at the deployed database — this is a live-data UI, not a
# sandbox, so treat the admin pages there as production.
#
# nginx is the only service publishing ports (80 and 443 on the host);
# stills-api is internal-only to compose. Swagger is at https://stills.lan/docs
# and REST under /api/v1 with the STILLS_API_TOKEN bearer. The cert is
# self-signed by docker/nginx/gen-cert.sh and stills.lan has to resolve
# locally, so a fresh machine needs an /etc/hosts entry first.

name = "stills-bank"
description = "stills-bank — code, run, cli; app and its compose stack side by side"
working_dir = "~/code/stills-bank"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "app"

[[tabs.panes]]
label = "docs"
command = "cd docs"
split = "right"

[[tabs]]
name = "run"

[[tabs.panes]]
label = "app"
command = "./scripts/up.sh"

[[tabs.panes]]
label = "logs"
command = "docker compose logs -f stills-api stills-worker"
split = "right"

[[tabs]]
name = "ui"

[[tabs.panes]]
label = "serve"
command = "uv run uvicorn app.api.main:create_app --factory --reload --port 8010"

[[tabs.panes]]
label = "ui"
command = "cd app/ui"
split = "right"

[[tabs]]
name = "cli"

[[tabs.panes]]
label = "app"

[[tabs.panes]]
label = "compose"
command = "docker compose ps"
split = "right"
