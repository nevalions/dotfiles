# news, lo environment — on-demand workspace for the main checkouts.
#
# Same shape as statsboard.toml: three tabs (code, run, cli), each split into
# two vertical panes, back on the left and front on the right. Unlike statsboard
# the two halves are separate repos rather than subdirectories of one checkout,
# so working_dir is ~/code and each pane cd's into its own repo — herdr-plus
# panes have no per-pane cwd, only the project-level working_dir.
#
# Replaces news-backend.toml + news-frontend.toml, which drove the two repos as
# unrelated projects. The environment is what varies, so the environment is what
# gets its own file; see news-spb.toml, identical but for the run tab's site.
#
# dev-infra.sh is `docker compose up -d --wait`, so it exits once redis is
# healthy and chains ahead of the server in the same pane. That is why there is
# no separate infra pane: back/front uses both slots.
#
# No agent or editor pane: the code tab is two bare shells, one per repo. The
# cli tab is the same — run-dev.sh uses `uv run`, so there is no venv to
# activate and nothing to distinguish the two. code is where you would start an
# agent or editor by hand.
#
# Also dropped in the port: the git tab (lazygit), and the named agent panes and
# pane sizes that workspace-manager's config.yml still expresses.

name = "news-lo"
description = "news, lo environment — code, run, cli; backend and frontend side by side"
working_dir = "~/code"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "back"
command = "cd news-backend"

[[tabs.panes]]
label = "front"
command = "cd news-frontend"
split = "right"

[[tabs]]
name = "run"

[[tabs.panes]]
label = "back"
command = "cd news-backend && ./scripts/dev-infra.sh && ./scripts/run-dev.sh lo"

[[tabs.panes]]
label = "front"
command = "cd news-frontend && npm run dev:lo"
split = "right"

[[tabs]]
name = "cli"

[[tabs.panes]]
label = "back"
command = "cd news-backend"

[[tabs.panes]]
label = "front"
command = "cd news-frontend"
split = "right"
