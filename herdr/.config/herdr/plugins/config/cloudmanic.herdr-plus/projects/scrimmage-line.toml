# scrimmage-line — on-demand workspace for the virtual-line graphics stack.
#
# Three sibling repos, one product: scrimmage-line (C++/CUDA engine),
# scrimmage-line-ui (React/Vite operator app talking to the engine over the WS
# contract in src/control/messages.h) and scrimmage-line-trainer (training and
# ONNX export for DLFieldNet, which the engine loads). Separate checkouts, so
# the tab is the repo and the panes are code and run — the portals.toml shape.
# working_dir is ~/code and every pane cd's into its repo.
#
# The engine's run pane is a build, not a server: `ninja` in the configured
# build/ directory, which leaves the pane sitting in build/ where the next
# command is `./scrimmage-line --in <clip>` with whatever flags that run needs.
# The tree is already configured (build/build.ninja exists); a fresh clone needs
# `cmake -G Ninja ..` once before this pane does anything.
#
# The trainer gets a single pane. Every trainer command is a per-run decision —
# scripts/train.py with its flags and a GPU budget, eval.py, export_skeleton.py,
# `uv run pytest` — and none of them should fire on workspace open, so a run
# pane would only be a second shell in the same directory as the first.
#
# Both engine panes export LD_LIBRARY_PATH for the out-of-tree OpenCV at
# ~/opt/opencv4. That build links imgcodecs against libjxl 0.11 while Arch now
# ships 0.12 — a SONAME bump — so every binary in build/ dies at exec with
# "libjxl.so.0.11: cannot open shared object file". The 0.11 libraries (jxl,
# jxl_threads and jxl_cms, which 0.11 needs its own copy of) are installed
# beside the OpenCV tree from the pacman cache, but that alone is not enough:
# the engine's RUNPATH covers its own direct dependencies, and libjxl is a
# dependency of libopencv_imgcodecs, whose RUNPATH is /usr/lib. Only a search
# path the loader applies to transitive lookups closes the gap.
#
# The permanent alternative is patchelf --set-rpath '$ORIGIN' on
# libopencv_imgcodecs.so.4.13.0, which would make the binaries run from any
# shell instead of only this workspace. It needs patchelf installed.
#
# The UI is pnpm, not npm (pnpm-lock.yaml), and vite serves on :5173 with the
# /ws proxy pointed at the engine.

name = "scrimmage-line"
description = "scrimmage-line — engine, ui and trainer; code and run side by side"
working_dir = "~/code"

[[tabs]]
name = "engine"

[[tabs.panes]]
label = "code"
command = 'cd scrimmage-line && export LD_LIBRARY_PATH=$HOME/opt/opencv4/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}'

[[tabs.panes]]
label = "run"
command = 'cd scrimmage-line/build && export LD_LIBRARY_PATH=$HOME/opt/opencv4/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} && ninja'
split = "right"

[[tabs]]
name = "ui"

[[tabs.panes]]
label = "code"
command = "cd scrimmage-line-ui"

[[tabs.panes]]
label = "run"
command = "cd scrimmage-line-ui && pnpm dev"
split = "right"

[[tabs]]
name = "trainer"

[[tabs.panes]]
label = "code"
command = "cd scrimmage-line-trainer"
