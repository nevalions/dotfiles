# statsboard — on-demand workspace for the main checkout.
#
# Three tabs (code, run, cli), each split into two vertical panes: back on the
# left, front on the right. herdr-plus panes have no per-pane cwd — only the
# project-level working_dir — so each pane cd's into its own subdirectory as
# part of its command.
#
# The redis dependency needs care. workspace-manager runs it as a blocking
# `setup:` step before any tab opens; herdr-plus has no setup hook, so the start
# command is folded into the run/back pane that actually needs it (redis backs
# play-detection state, src/match_videos/play_detection.py). Consequence: it is
# no longer guaranteed to complete before the other tabs start — only before the
# backend server does, which is the pane that cares.
#
# No agent or editor pane: the code tab is two bare shells, one per subproject.
# The cli tab is the same two shells with the backend venv already activated.
#
# See news-backend.toml for the other porting losses (named agent panes, pane
# sizes — splits here are always even).

name = "statsboard"
description = "statsboard — code, run, cli; backend and frontend side by side"
working_dir = "~/code/statsboard"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "back"
command = "cd statsboards-backend"

[[tabs.panes]]
label = "front"
command = "cd frontend-angular-signals"
split = "right"

[[tabs]]
name = "run"

[[tabs.panes]]
label = "back"
command = "docker start statsboards-redis 2>/dev/null || docker run -d --name statsboards-redis -p 6379:6379 redis:7-alpine; cd statsboards-backend && . ./venv/bin/activate && python -m src.runserver"

[[tabs.panes]]
label = "front"
command = "cd frontend-angular-signals && ng s"
split = "right"

[[tabs]]
name = "cli"

[[tabs.panes]]
label = "back"
command = "cd statsboards-backend && . ./venv/bin/activate"

[[tabs.panes]]
label = "front"
command = "cd frontend-angular-signals"
split = "right"
