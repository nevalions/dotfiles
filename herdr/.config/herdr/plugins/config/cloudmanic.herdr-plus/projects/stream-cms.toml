# stream-cms — on-demand workspace for the broadcast scheduler and public pages.
#
# Split out of the old stream.toml, which drove all four pipeline repos as tabs
# of one project. That shape hid the halves: stream-cms is a Go server *and* a
# web frontend — internal/web/templates (landing, watch, admin) plus
# internal/web/static (app.css, live.js, hls.min.js) — and a single tab per repo
# had nowhere to put the second half. So it takes the statsboard shape instead:
# code and cli split back (repo root) against front (internal/web).
#
# run is one pane, not two. The assets are compiled in with go:embed, so there
# is no separate frontend server to face the backend across a split — editing a
# template means restarting this pane, which `go run` recompiles anyway.
#
# The postgres from the README's local recipe is folded into the run pane the
# way statsboard.toml folds redis, herdr-plus having no setup hook. The
# container is named and reused rather than --rm, so a restart keeps whatever
# schedule you were testing against. Listens on :8080 — see ~/code/PORTS.md;
# PUBLIC_BASE_URL has to match it for absolute OG URLs to resolve.
#
# Deploys live in kube-lvl47, not here.

name = "stream-cms"
description = "stream-cms — code, run, cli; Go server and its web assets side by side"
working_dir = "~/code/stream-cms"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "back"

[[tabs.panes]]
label = "front"
command = "cd internal/web"
split = "right"

[[tabs]]
name = "run"

[[tabs.panes]]
label = "back"
command = "docker start stream-cms-pg 2>/dev/null || docker run -d --name stream-cms-pg -p 55432:5432 -e POSTGRES_PASSWORD=pw -e POSTGRES_USER=stream_cms -e POSTGRES_DB=stream_cms postgres:17; PGHOST=localhost PGPORT=55432 PGUSER=stream_cms PGPASSWORD=pw PGDATABASE=stream_cms MEDIA_DIR=./media EDGE_HLS_BASE=https://stream.monitoring-v.ru PUBLIC_BASE_URL=http://localhost:8080 go run ./cmd/stream-cms"

[[tabs]]
name = "cli"

[[tabs.panes]]
label = "back"

[[tabs.panes]]
label = "front"
command = "cd internal/web"
split = "right"
