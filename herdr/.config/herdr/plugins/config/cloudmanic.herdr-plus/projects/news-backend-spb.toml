# news-backend, spb environment — same shape as news-backend.toml, different
# run-dev argument. Ported from the news-backend-spb layout in
# workspace-manager's config.yml, which has no git tab either.
#
# Kept as a separate project rather than a variant: herdr-plus resolves one
# template per file, so an environment split is a second file. See
# news-backend.toml for what the port loses (named agent panes, pane sizes).

name = "news-backend-spb"
description = "news-backend, spb environment — agent, editor, infra, dev server"
working_dir = "~/code/news-backend"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "agent"
command = "claude"

[[tabs.panes]]
label = "editor"
command = "v"
split = "right"

[[tabs]]
name = "server"

[[tabs.panes]]
label = "infra"
command = "./scripts/dev-infra.sh"

[[tabs.panes]]
label = "dev"
command = "./scripts/run-dev.sh spb"
split = "down"
