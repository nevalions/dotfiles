# news-backend — on-demand workspace for the main checkout.
#
# Ported from the news-backend layout in
# ../../herdr-plugin-workspace-manager/config.yml, which still owns *worktree*
# layout (it routes by branch prefix, which herdr-plus cannot express). This
# file is the tmuxinator `start` verb workspace-manager lacks: it opens the main
# checkout on demand, nothing to do with worktrees.
#
# Two things did not survive the port, because herdr-plus has no equivalent:
#   - agent panes. workspace-manager declares `agent: claude` + `agentName`,
#     which registers a named agent with herdr. Here it is a plain command, so
#     herdr still detects Claude in the pane but the agent is unnamed.
#   - pane sizes. The editor pane was "60%"; splits here are even.

name = "news-backend"
description = "news-backend, lo environment — agent, editor, infra, dev server"
working_dir = "~/code/news-backend"

[[tabs]]
name = "code"

[[tabs.panes]]
label = "agent"
command = "claude"

[[tabs.panes]]
label = "editor"
command = "v"
split = "right"

[[tabs]]
name = "server"

[[tabs.panes]]
label = "infra"
command = "./scripts/dev-infra.sh"

[[tabs.panes]]
label = "dev"
command = "./scripts/run-dev.sh lo"
split = "down"

[[tabs]]
name = "git"
command = "lazygit"
