# uploader — on-demand workspace for the portal-media upload UI.
#
# Split out of the old stream.toml, so this repo now has a workspace of its own.
#
# One tab, one pane. It has a frontend half — internal/server/templates/
# index.html, the Authelia-protected page that turns a camera master into a
# published portal video — but it is go:embed'ed into the same binary, so there
# is nothing to run opposite the server and nothing for a second shell to own.
#
# There is no run tab either: uploader needs S3 credentials, a Forgejo token and
# a job namespace before it does anything, and it drives encoder Jobs in the
# cluster, so nothing here starts locally. With no server running, a cli tab
# would be a second idle shell — `go build ./...` and `go test ./...` go in this
# one. Deploys live in kube-lvl47, and the encoder it launches lives in the
# portals repo (scripts/, portal-media-encoder).

name = "uploader"
description = "uploader — repo shell; needs S3, Forgejo and a cluster, nothing runs locally"
working_dir = "~/code/uploader"

[[tabs]]
name = "code"

[[tabs.panes]]
