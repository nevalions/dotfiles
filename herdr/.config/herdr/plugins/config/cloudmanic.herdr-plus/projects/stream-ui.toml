# stream-ui — on-demand workspace for the streaming namespace admin dashboard.
#
# Split out of the old stream.toml, so this repo now has a workspace of its own.
#
# One pane per tab, as in stream-cms.toml. The single-page frontend —
# static/index.html, app.js, watch.html, watch.js — is compiled in with
# go:embed, so it has no server of its own to face the API across a split, and
# an asset edit is picked up by restarting the one pane. `node --test --watch
# tests/js/*.test.js` is the closest thing to a frontend loop, but it is a
# command to type, not something to fire on every workspace open.
#
# LISTEN_ADDR moves it to :8081. Both this and stream-cms default to :8080, and
# cms has the claim — see kube-lvl47/docs/operations/local-dev-ports.md. The
# dashboard starts without REDIS_ADDR, MEDIAMTX_API_URL or a kubeconfig-
# reachable streaming namespace, but its tabs stay empty until it can reach
# them; set them in the pane when you need real data.

name = "stream-ui"
description = "stream-ui — code, run, cli; one pane each, API and SPA in one binary"
working_dir = "~/code/stream-ui"

[[tabs]]
name = "code"

[[tabs.panes]]

[[tabs]]
name = "run"

[[tabs.panes]]
command = "LISTEN_ADDR=:8081 go run ."

[[tabs]]
name = "cli"

[[tabs.panes]]
