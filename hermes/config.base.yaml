# Portable Hermes settings.
#
# One `dotted.key: value` per line. `install.py` applies these with
# `hermes config set`, which is the only supported way to write config.yaml;
# the file is never edited or symlinked directly (Hermes rewrites it at
# runtime and migrations rewrite its shape).
#
# Existing local values win: a key already present in the live config.yaml is
# kept unless you pass --force. Values are passed to `hermes config set`
# verbatim, so JSON works for lists: ["a", "b"].

# Model and provider. The API key itself lives in ~/.hermes/.env
# (DEEPSEEK_API_KEY), never here.
model.default: deepseek-flash
model.provider: deepseek
model.base_url: https://api.deepseek.com

# OpenCode Go (deepseek-v4 family). API key/base URL resolve from
# ~/.hermes/.env (OPENCODE_GO_API_KEY / OPENCODE_GO_BASE_URL); see .env.example.
# 2026-11-12 opencode-go rollout: replaced openrouter/deepseek references in
# delegation, vision and MoA with the opencode-go provider.
delegation.backends.model_map.options: [{"name":"fast","description":"Cheap and quick work","provider":"opencode-go","model":"deepseek-v4.1-flash","reasoning_effort":"medium","service_tier":"normal"}]
auxiliary.vision.provider: opencode-go
auxiliary.vision.model: deepseek-v4.1-flash
auxiliary.vision.base_url: https://opencode.ai/zen/go/v1
moa.presets.default.reference_models: [{"provider":"openai-codex","model":"gpt-6.1-sol","enabled":true},{"provider":"opencode-go","model":"deepseek-v4-pro","enabled":true}]
moa.reference_models: [{"provider":"openai-codex","model":"gpt-6.1-sol","enabled":true},{"provider":"opencode-go","model":"deepseek-v4-pro","enabled":true}]

# Agent behavior.
agent.max_turns: 150
agent.reasoning_effort: high

# Share skills with Codex and Kimi Code. Both read ~/.agents/skills, which is
# stowed from codex-skills/. External dirs are read-only; Hermes still creates
# its own skills under ~/.hermes/skills.
skills.external_dirs: ["~/.agents/skills"]

# Kanban workers carry explicit task/parent history only, not the assignee's five
# latest cross-task runs. Requires the local kanban.include_role_history patch
# (default true); inert but harmless without it.
kanban.include_role_history: false
