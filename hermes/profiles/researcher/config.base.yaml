model.default: gpt-6-astra
model.provider: openai-codex
model.base_url: https://chatgpt.com/backend-api/codex
model.api_mode: codex_responses
agent.reasoning_effort: medium
agent.reasoning_overrides: {"k3.1-pro":"high","deepseek-v4-pro":"high"}
platform_toolsets.cli: ["terminal","file","skills","web","browser","code_execution","clarify","todo","session_search","no_mcp"]
web.search_backend: exa
web.extract_backend: exa
web.provider_tier.exa: free
web.keyless_fallback: true
web.keyless_rescue: true
memory.memory_enabled: false
memory.user_profile_enabled: false
memory.provider: honcho
hooks.pre_tool_call: [{"matcher":"write_file|patch|terminal|execute_code","command":"/home/linroot/.hermes/agent-hooks/vault-ro-guard.py","timeout":10,"fail_closed":true},{"matcher":"terminal|execute_code|browser_exec|process_manage|write_file|patch|multi_edit|computer_use","command":"/home/linroot/.hermes/agent-hooks/rbw-guard.py","timeout":10,"fail_closed":true}]
skills.disabled: ["llm-wiki"]
fallback_providers: [{"provider":"kimi-coding","model":"k3.1-pro"},{"provider":"deepseek","model":"deepseek-v4-pro"}]

# Kanban workers carry explicit task/parent history only, not the assignee's five
# latest cross-task runs. Requires the local kanban.include_role_history patch
# (default true); inert but harmless without it.
kanban.include_role_history: false
