model.default: kimi-for-coding
model.provider: kimi-coding
model.base_url: https://api.kimi.ai/coding/v1
agent.reasoning_effort: medium
platform_toolsets.cli: ["terminal","file","skills","code_execution","clarify","todo","web","session_search","memory","no_mcp"]
skills.disabled: ["apple-notes","apple-reminders","architecture-diagram","arxiv","ascii-video","baoyu-infographic","blocked-page-recovery","claude-code","claude-design","codex","competitor-news-monitor","computer-use","document-to-action-items","dogfood","email-inbox-triage","findmy","google-workspace","grounded-citations","himalaya","humanizer","imessage","manim-video","maps","meeting-action-items","microsoft-office","obsidian","p5js","pdf","popular-web-designs","product-price-monitor","simplify-code","songwriting-and-ai-music","spike","teams-meeting-pipeline","weekly-review-planning","xurl","youtube-content"]
hooks.pre_tool_call: [{"matcher":"terminal|execute_code|browser_exec|process_manage|write_file|patch|multi_edit|computer_use","command":"/home/linroot/.hermes/agent-hooks/rbw-guard.py","timeout":10,"fail_closed":true}]
approvals.deny: ["kubectl *","helm *","git push*","git -* push*","gh pr create*","gh * pr create*","gh pr merge*","gh * pr merge*"]

# Kanban workers carry explicit task/parent history only, not the assignee's five
# latest cross-task runs. Requires the local kanban.include_role_history patch
# (default true); inert but harmless without it.
kanban.include_role_history: false
