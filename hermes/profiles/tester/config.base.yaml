model.default: kimi-for-coding
model.provider: kimi-coding
agent.reasoning_effort: medium
agent.max_turns: 30
platform_toolsets.cli: ["terminal","file","skills","clarify","todo","no_mcp"]
terminal.cwd: /home/linroot
hooks.pre_tool_call: [{"matcher":"terminal|execute_code|browser_exec|process_manage|write_file|patch|multi_edit|computer_use","command":"/home/linroot/.hermes/agent-hooks/rbw-guard.py","timeout":10,"fail_closed":true}]
approvals.deny: ["kubectl *","helm *","git push*","git -* push*","gh pr create*","gh * pr create*","gh pr merge*","gh * pr merge*"]

# Kanban workers carry explicit task/parent history only, not the assignee's five
# latest cross-task runs. Requires the local kanban.include_role_history patch
# (default true); inert but harmless without it.
kanban.include_role_history: false
