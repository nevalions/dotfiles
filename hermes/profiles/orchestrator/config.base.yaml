model.default: gpt-6-astra
model.provider: openai-codex
model.base_url: https://chatgpt.com/backend-api/codex
model.api_mode: codex_responses
agent.reasoning_effort: medium

# Kanban workers carry explicit task/parent history only, not the assignee's five
# latest cross-task runs. Requires the local kanban.include_role_history patch
# (default true); inert but harmless without it.
kanban.include_role_history: false
