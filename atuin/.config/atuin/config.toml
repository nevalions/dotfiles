## atuin 18.20 — only non-default overrides live here.
## Full annotated reference: `atuin default-config`
## Read/set values without editing this file: `atuin config`

## Enter accepts the selection into the buffer instead of running it.
enter_accept = false

## Start the search TUI in vim normal mode.
keymap_mode = "vim-normal"

## Default to the current git repo. With ~50 repos under ~/code, global search
## is mostly other projects' noise. ctrl-r cycles out to global/host/session.
## Worktrees resolve to their main repo.
filter_mode = "workspace"

## Commands never written to history.
## These are UNANCHORED regexes matched anywhere in the command, so they must
## be anchored explicitly. The previous list was a plain word list, which meant
## "git" dropped every git command and "ls"/"cd"/"cl"/"cx"/"lt" dropped
## anything containing those letters.
history_filter = [
  ## navigation and listing noise, with or without arguments
  "^(ls|lsa|lt|lg|cl|cx|tree|cd|nvim)( |$)",
  ## short aliases: v=nvim (was the single most-recorded command), l=eza,
  ## b=bat, and bare . / .. -- note "./script" is deliberately still recorded
  "^(v|l|b)( |$)",
  "^\\.\\.?( |$)",
  ## tmuxinator shortcuts
  "^tr[123]( |$)",
  ## bare `git`, plus the two verbs that carry no useful history
  "^git$",
  "^git (pull|push)( |$)",
  "^ng s( |$)",
  ## exact-match only
  "^(exit|reboot)$",
]

[sync]
## record-based sync (v2). No account configured yet; harmless until login.
records = true

[tmux]
## Render interactive search in a tmux popup when running inside tmux.
## Requires tmux >= 3.2. Override at runtime with ATUIN_TMUX_POPUP.
enabled = true

[ui]
## Result columns, left to right. "command" expands to fill remaining space.
columns = [
  { type = "time", width = 8 },
  { type = "duration", width = 6 },
  { type = "directory", width = 26 },
  { type = "exit", width = 3 },
  "command",
]

[daemon]
## Background daemon. Still marked *Experimental* upstream in 18.20, and
## enabled HERE ONLY -- this is the workstation, not a server. Bead
## ansible-n1j0.
##
## It does NOT give the atuin MCP server's atuin_output tool anything to read.
## Measured on 18.20.1: capture happens only in `pty_proxy`, via OSC 133 in an
## interactive shell. Commands run by an agent go through `zsh -c` with no PTY,
## and `atuin history end` has no output argument at all, so agent-run commands
## can never have their output stored by this version. pty_proxy is
## deliberately NOT enabled: it re-execs the shell, and with `atuin init` at
## line ~306 of ~400 that doubles startup from 0.46s to roughly 0.9s, to
## capture human output only.
##
## The daemon still earns its place -- it owns sync and the history socket, and
## a future atuin that can store agent output will find it already running.
##
## roles/atuin in the ansible repo keeps daemon.enabled = false for the server
## profile, deliberately: cluster nodes gain nothing here and have no business
## running an experimental daemon. Do not "fix" the asymmetry.
enabled = true

## No systemd unit ships with the Arch package, so the daemon is started by the
## first shell that needs it rather than by the service manager. That is also
## what makes it come back after a reboot.
autostart = true
